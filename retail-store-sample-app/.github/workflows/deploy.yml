name: Build and Deploy Retail Store

on:
  push:
    branches:
      - gitops
    paths:
      - "src/**"

permissions:
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:

  # --------------------------------
  # Step 1: Find changed services
  # --------------------------------
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |

          SERVICES=""

          if git diff --name-only HEAD~1 HEAD | grep -q "^src/cart/"; then
            SERVICES="$SERVICES cart"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^src/catalog/"; then
            SERVICES="$SERVICES catalog"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^src/checkout/"; then
            SERVICES="$SERVICES checkout"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^src/orders/"; then
            SERVICES="$SERVICES orders"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^src/ui/"; then
            SERVICES="$SERVICES ui"
          fi

          echo "Changed services: $SERVICES"

          JSON=$(echo "$SERVICES" | jq -R -s -c 'split(" ") | map(select(length > 0))')

          echo "services=$JSON" >> "$GITHUB_OUTPUT"


  # --------------------------------
  # Step 2: Build and push images
  # --------------------------------
  build-and-push:
    name: Build and Push Images
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Get AWS account ID
      - name: Get AWS Account ID
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      # Build Docker image
      - name: Build Docker Image
        run: |

          docker build \
            -t $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-${{ matrix.service }}:${GITHUB_SHA} \
            ./src/${{ matrix.service }}

      # Push Docker image
      - name: Push Docker Image
        run: |

          docker push \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-${{ matrix.service }}:${GITHUB_SHA}


  # --------------------------------
  # Step 3: Update Helm values
  # --------------------------------
  update-manifests:
    name: Update Helm Values
    needs:
      - detect-changes
      - build-and-push

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: gitops
          fetch-depth: 0

      # Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Get AWS account ID
      - name: Get AWS Account ID
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      # Update values.yaml
      - name: Update Helm values
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |

          echo "Services to update:"
          echo "$SERVICES"

          for SERVICE in $(echo "$SERVICES" | jq -r '.[]'); do

            FILE="./src/$SERVICE/chart/values.yaml"

            echo "Updating $FILE"

            sed -i \
              "s|repository:.*|repository: $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-$SERVICE|" \
              "$FILE"

            sed -i \
              "s|tag:.*|tag: \"${GITHUB_SHA}\"|" \
              "$FILE"

            echo "Updated:"
            grep -A3 "^image:" "$FILE"

          done

      # Commit all changes once
      - name: Commit Helm changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/*/chart/values.yaml

          git commit \
            -m "Update Docker images [skip ci]"

      # Push one time
      - name: Push GitOps changes
        run: |

          git push origin gitops
