name: Build and Deploy Retail Store

on:
  push:
    branches:
      - gitops
    paths:
      - "retail-store-sample-app/src/**"

permissions:
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:

  # 1. Find which services changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |

          SERVICES=""

          if git diff --name-only HEAD~1 HEAD | grep -q "^retail-store-sample-app/src/cart/"; then
            SERVICES="$SERVICES cart"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^retail-store-sample-app/src/catalog/"; then
            SERVICES="$SERVICES catalog"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^retail-store-sample-app/src/checkout/"; then
            SERVICES="$SERVICES checkout"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^retail-store-sample-app/src/orders/"; then
            SERVICES="$SERVICES orders"
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "^retail-store-sample-app/src/ui/"; then
            SERVICES="$SERVICES ui"
          fi

          echo "Changed services: $SERVICES"

          JSON=$(echo "$SERVICES" | jq -R -s -c 'split(" ") | map(select(length > 0))')

          echo "services=$JSON" >> "$GITHUB_OUTPUT"


  # 2. Build and push Docker images
  build-and-push:
    name: Build and Push Docker Images
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            -t $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-${{ matrix.service }}:${GITHUB_SHA} \
            ./retail-store-sample-app/src/${{ matrix.service }}

      - name: Push Docker Image
        run: |
          docker push \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-${{ matrix.service }}:${GITHUB_SHA}


  # 3. Update Helm values
  update-manifests:
    name: Update Helm Values
    needs:
      - detect-changes
      - build-and-push

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: gitops
          fetch-depth: 0

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Update Helm values
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}

        run: |

          echo "Updating Helm values..."

          for SERVICE in $(echo "$SERVICES" | jq -r '.[]'); do

            FILE="./retail-store-sample-app/src/$SERVICE/chart/values.yaml"

            echo "Updating $FILE"

            sed -i \
              "s|repository:.*|repository: $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-$SERVICE|" \
              "$FILE"

            sed -i \
              "s|tag:.*|tag: \"${GITHUB_SHA}\"|" \
              "$FILE"

            echo "Updated $FILE"

          done

      - name: Commit Helm changes
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add retail-store-sample-app/src/*/chart/values.yaml

          git commit \
            -m "Update Docker images [skip ci]"

      - name: Push changes to GitHub
        run: |

          git push origin gitops
