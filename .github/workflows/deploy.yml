name: Build and Deploy Retail Store

on:
  push:
    branches:
      - gitops
      - main
    paths:
      - "retail-store-sample-app/src/**"

permissions:
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:

  # ============================================================
  # 1. Build and push Docker images to Amazon ECR
  # ============================================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - cart
          - catalog
          - checkout
          - orders
          - ui

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS
      # --------------------------------------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Get AWS Account ID
      # --------------------------------------------------------
      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "AWS Account ID: $ACCOUNT_ID"
          echo "AWS Region: $AWS_REGION"
          echo "Service: ${{ matrix.service }}"

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker Image
        run: docker build -t $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-${{ matrix.service }}:${GITHUB_SHA} ./retail-store-sample-app/src/${{ matrix.service }}

      # --------------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------------
      - name: Push Docker Image
        run: docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-${{ matrix.service }}:${GITHUB_SHA}


  # ============================================================
  # 2. Update Helm values.yaml
  # ============================================================
  update-manifests:
    name: Update Helm Values
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout gitops branch
      # --------------------------------------------------------
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: gitops
          fetch-depth: 0

      # --------------------------------------------------------
      # Configure AWS
      # --------------------------------------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Get AWS Account ID
      # --------------------------------------------------------
      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "AWS Account ID: $ACCOUNT_ID"
          echo "AWS Region: $AWS_REGION"

      # --------------------------------------------------------
      # Update all Helm values.yaml files
      # --------------------------------------------------------
      - name: Update Helm values
        run: |
          SERVICES="cart catalog checkout orders ui"

          for SERVICE in $SERVICES; do

            FILE="./retail-store-sample-app/src/$SERVICE/chart/values.yaml"

            echo "========================================"
            echo "Updating $SERVICE"
            echo "File: $FILE"
            echo "========================================"

            sed -i "s|repository:.*|repository: $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/retail-store-$SERVICE|" "$FILE"

            sed -i "s|tag:.*|tag: \"${GITHUB_SHA}\"|" "$FILE"

            echo "Updated $FILE"

          done

      # --------------------------------------------------------
      # Display updated values
      # --------------------------------------------------------
      - name: Show updated Helm values
        run: |
          SERVICES="cart catalog checkout orders ui"

          for SERVICE in $SERVICES; do

            FILE="./retail-store-sample-app/src/$SERVICE/chart/values.yaml"

            echo "========================================"
            echo "$FILE"
            echo "========================================"

            cat "$FILE"

          done

      # --------------------------------------------------------
      # Commit changes
      # --------------------------------------------------------
      - name: Commit Helm changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add retail-store-sample-app/src/*/chart/values.yaml

          git commit -m "Update Docker images [skip ci]"

      # --------------------------------------------------------
      # Push changes back to gitops
      # --------------------------------------------------------
      - name: Push changes to GitHub
        run: git push origin gitops
