apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/NikhilBCA2022/ArgocdPractice.git
    targetRevision: HEAD
    path: app_of_apps/apps

  destination:
    server: https://172.31.72.207:33893 
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
